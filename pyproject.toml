[project]
name = "liceo"
version = "0.1.0"
description = "Liceo Rest API"
authors = []
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi[standard] (>=0.116.1,<0.117.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "bcrypt (>=4.3.0,<5.0.0)",
    "sqlalchemy (>=2.0.43,<3.0.0)",
    "pg8000 (>=1.31.4,<2.0.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "shortuuid (>=1.0.13,<2.0.0)",
    "opentelemetry-exporter-otlp-proto-http (>=1.37.0,<2.0.0)",
    "opentelemetry-api (>=1.37.0,<2.0.0)",
    "opentelemetry-sdk (>=1.37.0,<2.0.0)",
    "python-json-logger (>=3.3.0,<4.0.0)",
    "apscheduler (>=3.11.0,<4.0.0)",
    "reactivex>=4.0.4",
    "filetype>=1.2.0",
]

# [tool.hatch.build]
# include = ["src/liceo"]

# [tool.poetry]
# packages = [{ include = "liceo", from = "src" }]

[dependency-groups]
dev = [
    "isort (==6.0.1)",
    "pytest (==8.4.1)",
    "testcontainers[postgres] (==4.13.0)",
    "coverage (==7.10.6)",
    "pytest-archon (==0.0.7)",
    "mkdocs-material (==9.6.20)",
    "sqlfluff (==3.4.2)",
    "ruff>=0.14.0",
    "ty>=0.0.1a22",
]

[tool.isort]
profile = "black"

[tool.coverage.run]
branch = true
omit = ["*/test*"]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "coverage_html_report"

[tool.pytest.ini_options]
markers = [
    "integration: uses testcontainers (deselect with '-m \"not integration\"')",
    "serial",
]

[project.scripts]
run_app = "main:main"

# [virtualenvs]
# create = true
# in-project = true

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"
